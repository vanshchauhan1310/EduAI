[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt --prefer-binary"

[deploy]
startCommand = "alembic upgrade head && gunicorn -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5 --log-level info main:app"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
